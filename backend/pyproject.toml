[project]
name = "career-flow-backend"
version = "0.1.0"
description = "Career Flow - AI-powered resume tailoring backend"
authors = [
    {name = "Borna Barahimi",email = "bornabarahimi@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "fastapi (>=0.135.1,<0.136.0)",
    "uvicorn[standard] (>=0.41.0,<0.42.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "python-multipart (>=0.0.22,<0.0.23)",
    "pydantic-ai-slim[anthropic,google,openai] (>=1.68.0,<2.0.0)",
    "litellm (>=1.82.2,<2.0.0)",
    "docling (>=2.80.0,<3.0.0)",
    "pymupdf4llm (>=1.27.2.1,<2.0.0.0)",
    "playwright (>=1.58.0,<2.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "langgraph (>=0.3.0,<0.4.0)",
    "langgraph-checkpoint-sqlite (>=2.0.0,<3.0.0)"
]

[project.optional-dependencies]
dev = [
    "pytest (>=8.0.0,<9.0.0)",
    "pytest-asyncio (>=0.25.0,<0.26.0)",
    "httpx (>=0.25.0,<1.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
